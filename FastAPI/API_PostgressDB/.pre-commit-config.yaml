# Pre-commit runs the lint / format / type-check gates — NOT the test suite.
# Unit tests are intentionally excluded here (they belong in CI, or run manually
# with `uv run pytest`) so commits stay fast. These local hooks mirror the exact
# gate commands, through `uv run`, so hook results and terminal results cannot
# diverge. Install with `uv run pre-commit install` after `uv sync`.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: uv run ruff check src tests --fix
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format src tests
        language: system
        pass_filenames: false
        always_run: true

      - id: pyrefly
        name: pyrefly check
        entry: uv run pyrefly check
        language: system
        pass_filenames: false
        always_run: true
