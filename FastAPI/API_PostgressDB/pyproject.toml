[project]
name = "fastapi-clean-architecture"
version = "1.0.0"
description = "FastAPI application using Clean Architecture with async SQLAlchemy"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "email-validator>=2.0.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "injector>=0.22.0",
    "PyJWT>=2.10.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=3.2.0,<4.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "pyrefly>=1.1.0",
    "aiosqlite>=0.20.0",
    "types-passlib>=1.7.7",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "pyrefly>=1.1.0",
    "aiosqlite>=0.20.0",
    "types-passlib>=1.7.7",
    "pre-commit>=4.0.0",
]

[tool.ruff]
line-length = 140
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.pyrefly]
python-version = "3.13"
project-includes = ["src/**", "tests/**", "test_api.py"]
# "legacy" is pyrefly's own recommended preset for codebases migrating from
# mypy: it matches mypy's practical strictness without adopting pyrefly-only
# checks (e.g. mandatory @override) that would be a separate, bigger change.
preset = "legacy"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
